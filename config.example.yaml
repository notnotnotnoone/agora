# Agora model configuration — copy to `config.yaml` and fill in your own API keys.
#
# ⚠️ Path note: the current config-loader reads `../config.yaml` (one directory ABOVE the
#    app root — process.cwd()/../config.yaml). So when running `npm run dev` from this repo,
#    place your real `config.yaml` in the PARENT folder. (TODO: worth changing the loader to
#    read `./config.yaml` at the repo root before publishing standalone — see config-loader.ts.)
#
# API keys live only in your real config.yaml, which is gitignored. Never commit real keys.

providers:
  - name: cerebras
    base_url: https://api.cerebras.ai/v1
    api_key: YOUR_CEREBRAS_KEY
    header_parser: openai_compatible
    models:
      - name: llama3.1-8b
        intelligence: 6
        vision: false
        rate_limits: { rpm: 30, tpm: 60000 }
      - name: gpt-oss-120b
        intelligence: 9
        vision: false
        rate_limits: { rpm: 30, tpm: 60000 }

  - name: groq
    base_url: https://api.groq.com/openai/v1
    api_key: YOUR_GROQ_KEY
    header_parser: openai_compatible
    models:
      - name: llama-3.3-70b-versatile
        intelligence: 7
        vision: false
        rate_limits: { rpm: 30, tpm: 12000 }

  - name: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key: YOUR_OPENROUTER_KEY
    header_parser: openrouter
    models:
      - name: nvidia/nemotron-3-super-120b-a12b:free
        intelligence: 8
        vision: false
        rate_limits: { rpm: 20, tpm: 50000 }
